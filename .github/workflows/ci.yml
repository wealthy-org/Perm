name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  application-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: perm_test
          POSTGRES_PASSWORD: perm_test
          POSTGRES_DB: perm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perm_test -d perm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm audit:security
      - run: pnpm contracts:compile
      - run: pnpm contracts:test
      - run: pnpm contracts:coverage
      - name: Upload Solidity coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidity-coverage
          path: coverage/
          if-no-files-found: ignore
      - run: pnpm server:test
      - run: pnpm release:test-gates
      - run: pnpm indexer:test-target
      - run: pnpm indexer:test-schema
      - name: Test schema on PostgreSQL 17
        run: pnpm indexer:test-postgres
        env:
          TEST_DATABASE_URL: postgres://perm_test:perm_test@127.0.0.1:5432/perm_test
          PGSSLMODE: disable
      - run: pnpm build
      - run: pnpm audit:bundle
      - name: Validate operations scripts
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find scripts contracts/scripts -type f \( -name '*.cjs' -o -name '*.mjs' \) -print0)
          echo "Validated $count operational JavaScript files"

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install slither-analyzer==0.11.3
      - name: Slither security analysis
        run: slither . --exclude-dependencies --filter-paths 'contracts/src/mocks|contracts/test'
