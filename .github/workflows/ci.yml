name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  application-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: perm_test
          POSTGRES_PASSWORD: perm_test
          POSTGRES_DB: perm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perm_test -d perm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm audit:security
      - run: corepack pnpm contracts:compile
      - run: corepack pnpm contracts:test
      - run: corepack pnpm contracts:coverage
      - name: Upload Solidity coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidity-coverage
          path: coverage/
          if-no-files-found: ignore
      - run: corepack pnpm server:test
      - run: corepack pnpm release:test-gates
      - run: corepack pnpm indexer:test-schema
      - name: Test schema on PostgreSQL 17
        run: corepack pnpm indexer:test-postgres
        env:
          TEST_DATABASE_URL: postgres://perm_test:perm_test@127.0.0.1:5432/perm_test
          PGSSLMODE: disable
      - run: corepack pnpm build
      - name: Validate operations scripts
        run: |
          node --check scripts/discover-pools.cjs
          node --check scripts/indexer.cjs
          node --check scripts/test-indexer-schema.mjs
          node --check scripts/test-indexer-postgres.mjs
          node --check scripts/test-release-gates.mjs
          node --check scripts/monitor.cjs
          node --check scripts/promote-deployment.cjs
          node --check scripts/verify-candidate.cjs

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: python -m pip install slither-analyzer==0.11.3
      - name: Slither security analysis
        run: slither . --exclude-dependencies --filter-paths 'contracts/src/mocks|contracts/test'
