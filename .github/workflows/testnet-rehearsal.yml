name: Testnet fork and release rehearsal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  latest-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Real v4 pool integration on latest finalized testnet state
        env:
          RH_TESTNET_RPC_URL: ${{ secrets.RH_TESTNET_RPC_URL }}
        run: corepack pnpm contracts:test:fork
      - name: Rehearse complete Router v2 deployment and post-deploy validation
        env:
          RH_TESTNET_RPC_URL: ${{ secrets.RH_TESTNET_RPC_URL }}
          TIMELOCK_PROPOSER_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
          TIMELOCK_DELAY_SECONDS: "60"
        run: corepack pnpm contracts:rehearse:testnet
      - name: Validate rehearsal manifest
        run: node -e 'const m=require("./deployments/robinhood-testnet.rehearsal.json"); if(m.routerVersion!==2||m.postDeploymentChecks!=="passed"||m.releaseStatus!=="rehearsal"||!m.timelock||m.timelockDelaySeconds!==60) process.exit(1)'
